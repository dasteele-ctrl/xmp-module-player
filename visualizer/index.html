<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'unsafe-inline'; connect-src 'self'; media-src 'none'; object-src 'none'">
<title>Modulez Player • Visualization</title>
<style>:root{color-scheme:dark}select,select option,optgroup{background:#10262e!important;color:#dbeff0!important}select{appearance:none;padding-right:12px}select option:checked{background:#16515a!important;color:white!important}[hidden]{display:none!important}html,body{margin:0;height:100%;background:#071218;color:#dbeff0;font:13px sans-serif}body{display:flex;flex-direction:column}header{padding:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #25545a}strong{color:#65eee0}button,select{background:#10262e;color:#dbeff0;border:1px solid #34616a;border-radius:4px;padding:7px}main{min-height:0;flex:1;position:relative}canvas{display:block;width:100%;height:100%}#status{font:12px monospace;color:#819fa2}footer{padding:9px;color:#819fa2;font-size:12px}label{display:flex;gap:7px;align-items:center}#presetMenu{position:fixed;z-index:1000;min-width:175px;padding:5px;background:#0d1e25;border:1px solid #34616a;border-radius:5px;box-shadow:0 5px 20px #0009}#presetMenu button{display:block;width:100%;text-align:left;border:0;background:transparent}#presetMenu button:hover,#presetMenu button:focus{background:#16515a;outline:none}#presetMenu button:disabled{color:#819fa2}button:disabled{opacity:.6}.preset-links{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:12px;color:#819fa2}.preset-links a{color:#65eee0;text-decoration:underline}.preset-links a:hover,.preset-links a:focus{color:#dbeff0}
/* Keep controls visibly raised from the toolbar, even in low-contrast themes. */
header{background:var(--toolbar-panel,#10262e);border-color:var(--toolbar-border,#34616a);color:var(--toolbar-text,#e6e6e6)}
header strong{color:var(--toolbar-accent,#65eee0)}
header button,header select{box-sizing:border-box;min-height:32px;padding:6px 10px;border:1px solid var(--toolbar-border,#64858c);border-radius:6px;background:var(--toolbar-control,#23434b)!important;color:var(--toolbar-text,#e6e6e6)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 1px 2px rgba(0,0,0,.28);font:inherit;font-weight:600;cursor:pointer}
header select{appearance:none;padding-right:28px;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%)!important;background-position:calc(100% - 13px) 50%,calc(100% - 8px) 50%!important;background-size:5px 5px!important;background-repeat:no-repeat!important}
header select option,header select optgroup{background:var(--toolbar-control,#23434b)!important;color:var(--toolbar-text,#e6e6e6)!important}
header button:hover:not(:disabled),header select:hover:not(:disabled){background-color:var(--toolbar-hover,#34565e)!important;border-color:var(--toolbar-accent,#65eee0)}
header button:active:not(:disabled),header select:active:not(:disabled){background-color:var(--toolbar-selection,#16515a)!important;box-shadow:inset 0 1px 3px rgba(0,0,0,.4)}
header button:focus-visible,header select:focus-visible,header a:focus-visible{outline:2px solid var(--toolbar-accent,#65eee0);outline-offset:2px}
header button:disabled,header select:disabled{cursor:default;opacity:.55}
header #engine{border-color:var(--toolbar-accent,#65eee0)}
header .preset-links a{color:var(--toolbar-accent,#65eee0);text-decoration:none;border:1px solid var(--toolbar-border,#64858c);background:var(--toolbar-control,#23434b);border-radius:6px;padding:5px 8px}
header .preset-links a:hover{background:var(--toolbar-hover,#34565e);border-color:var(--toolbar-accent,#65eee0)}
#presetMenu{background:var(--toolbar-panel,#0d1e25);border-color:var(--toolbar-border,#34616a)}
#presetMenu button:hover,#presetMenu button:focus{background:var(--toolbar-selection,#16515a)}
/* Keep canvas intrinsic dimensions out of the flex layout. */
html,body{overflow:hidden;width:100%;height:100%}
header{flex:0 0 auto;max-height:45%;overflow:auto;box-sizing:border-box;gap:5px;padding:5px}
header button,header select{min-height:27px;padding:4px 8px}
header select{padding-right:25px;min-width:0;max-width:100%}
header label{min-width:0;max-width:100%}
header .preset-links{gap:5px}
header .preset-links a{padding:3px 6px}
main{flex:1 1 0;min-height:0;min-width:0;overflow:hidden}
main canvas{position:absolute;inset:0;width:100%;height:100%}
</style>
<header><strong>Wavescope</strong><label>Engine <select id="engine"><option value="standard">Standard modes</option><option value="projectm">projectM / MilkDrop</option></select></label><label id="modeLabel">Mode <select id="mode"></select></label><label id="presetLabel" hidden>Preset <select id="preset"></select></label><button id="importPresets" title="Add .milk files to your saved preset library">Import Presets</button><span id="engineStatus"></span><label>Color <select id="palette"></select></label><button id="tone" hidden>Test signal: off</button><span id="status">Waiting for player PCM</span><nav class="preset-links" aria-label="Download MilkDrop presets"><span>Get presets:</span><a href="https://github.com/projectM-visualizer/presets-cream-of-the-crop" title="Open Cream of the Crop in your browser">Cream of the Crop</a><a href="https://github.com/projectM-visualizer/presets-projectm-classic" title="Open Classic projectM in your browser">Classic projectM</a></nav></header>
<main><canvas id="scope"></canvas><canvas id="canvas" hidden></canvas></main>
<div id="presetMenu" role="menu" aria-label="MilkDrop presets" hidden><button role="menuitem" data-preset-action="next">Next Preset</button><button role="menuitem" data-preset-action="previous">Previous Preset</button><button role="menuitem" data-preset-action="random">Random Preset</button><button role="menuitem" id="menuImport">Import Presets…</button></div>
<script src="presets.js"></script><script src="wavescope.js"></script><script src="viewer.js"></script><script type="module" src="projectm-adapter.js"></script></html>
